[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SkelToJson"
version = "1.0.0"
description = "Convert Spine binary .skel files to JSON (Spine 4.2/4.3)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Bastien GIMBERT" }]
keywords = ["spine", "skel", "json", "converter", "2d", "animation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
skel-to-json = "SkelToJson.cli:main"

[project.urls]
Homepage = "https://github.com/BastienGIMBERT/SkelToJson"
